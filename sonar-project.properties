# SonarQube / SonarCloud project configuration — ParkiUpar
# Para SonarCloud, el organization y projectKey los provee la UI al crear el proyecto.
# Para SonarQube self-hosted, ajusta sonar.host.url y sonar.token en el entorno.

sonar.projectKey=parkiupar
sonar.projectName=ParkiUpar
sonar.projectVersion=1.0.0

# Cuando uses SonarCloud, descomenta y rellena:
# sonar.organization=<your-sonarcloud-org>

# Fuentes analizadas
sonar.sources=src,supabase/functions
sonar.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  src/test/**,\
  src/components/ui/**,\
  src/integrations/supabase/types.ts,\
  supabase/functions/_shared/**/*.test.ts,\
  **/node_modules/**,\
  **/dist/**,\
  **/reports/**,\
  **/.stryker-tmp/**

# Tests
sonar.tests=src,supabase/functions
sonar.test.inclusions=\
  src/**/*.test.ts,\
  src/**/*.test.tsx,\
  src/**/*.spec.ts,\
  src/**/*.spec.tsx,\
  supabase/functions/**/*.test.ts

# Lenguajes
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Cobertura — importada de Vitest (v8/lcov) y deno coverage
sonar.javascript.lcov.reportPaths=reports/coverage/front/lcov.info
sonar.typescript.lcov.reportPaths=reports/coverage/front/lcov.info
# Cuando se habiliten tests Deno con coverage, añadir:
# sonar.javascript.lcov.reportPaths=reports/coverage/front/lcov.info,reports/coverage/back/lcov.info

# Resultados de tests (JUnit)
sonar.testExecutionReportPaths=reports/junit/front.junit.xml

# Quality Gate (gestionado en la UI de Sonar; el pipeline debe hacer fail si no pasa)
